name: tests
on: [push, pull_request]
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m game_solving generate --config configs/congestion_exact.json --output outputs/ci-data
      - run: python -m game_solving solve --config configs/congestion_exact.json --input outputs/ci-data/solver_inputs.jsonl --output outputs/ci-solve
