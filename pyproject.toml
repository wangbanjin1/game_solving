[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-solving"
version = "2.0.0"
description = "Individual dual-direction resource simulation and bounded game solving"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
game-solving = "game_solving.application.cli:main"

[tool.setuptools.packages.find]
include = ["game_solving*", "configs"]

[tool.setuptools.package-data]
configs = ["*.json"]
