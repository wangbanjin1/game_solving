[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-solving"
version = "0.1.0"
description = "Reproducible synthetic cell simulation and finite-candidate resource game solver"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
game-solving = "simulation_generator.cli:main"

[tool.setuptools.packages.find]
include = ["experience_solver*", "simulation_generator*", "configs"]

[tool.setuptools.package-data]
configs = ["*.json"]
